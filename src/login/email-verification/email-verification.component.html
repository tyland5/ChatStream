
  <div class="flex flex-col items-center pt-[20px]">
    <div class="w-[300px] mb-[20px]">
      <p class="text-base dark:text-white">We've sent a confirmation code to your email. Enter it here</p>
      <input type="text" class="w-full p-[4px]" [(ngModel)]="inputtedCode">
      <p *ngIf="showWrongCodeErr" class="text-base text-red-600">Wrong code</p>
    </div>

    <button class="bg-purple-400 text-lg py-3 px-6 rounded-lg block mb-4 dark:text-white hover:bg-purple-500" (click)="checkCode()">Confirm</button>
  </div>
