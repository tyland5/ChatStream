
<div  
class="flex gap-[10px] items-center flex-nowrap text-ellipsis hover:bg-gray-600 hover:cursor-pointer"
(click)="userSelected()">
    <img class="h-[40px] min-w-[40px] bg-white rounded-full" [src]="pfp"/>

    <!-- https://stackoverflow.com/questions/36230944/prevent-flex-items-from-overflowing-a-container -->
    <div class="min-w-0">
        <p class="text-ellipsis overflow-hidden whitespace-nowrap dark:text-white">{{name}}</p>
        <p class="text-ellipsis text-sm overflow-hidden whitespace-nowrap dark:text-gray-300">{{"@" + username}}</p>
    </div>

    <mat-checkbox class="ml-auto" *ngIf="inCreateChat" color="primary" [checked]="selected"></mat-checkbox>
    <div *ngIf="inIncomingRequest || inOutgoingRequest" class="ml-auto">
        <mat-icon *ngIf="inIncomingRequest || inOutgoingRequest" class="text-red-600 mr-[10px]" fontIcon="cancel" (click)="handleCancelClicked()"></mat-icon>
        <mat-icon *ngIf="inIncomingRequest" class="text-green-500" fontIcon="check_circle" (click)="handleConfirmClicked()"></mat-icon>
    </div>
</div>
