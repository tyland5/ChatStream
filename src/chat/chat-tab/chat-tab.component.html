<body class="flex h-[calc(100vh-3rem)] w-full overflow-x-hidden">
    <div [hidden]="onMobile && showChatPage" class="h-full overflow-y-auto min-w-[240px] pt-[16px]  px-[12px] border-r-[1px] border-gray-50 md:w-1/5 w-full">
        <chat-list [userInfoDict]="userInfoDict"></chat-list>
    </div>

    <div [hidden]="onMobile && !showChatPage" class="md:w-4/5 w-full">
        <chat-page [userInfoDict]="userInfoDict" (backPressed)="showChatPage=false"></chat-page>
    </div>
</body>
