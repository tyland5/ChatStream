<div>
    <div [ngClass]="{'bg-gray-600': highlightedMessage === true}" class="flex gap-[10px] mb-[20px] hover:bg-gray-600">
        <div>
            <img class="h-[40px] w-[40px] bg-white rounded-full" [src]="messageInfo.senderInfo.pfp"/>
        </div>
            
        <div class="flex-1">
            <div class="flex items-end gap-[10px]">
                <p class="text-base font-bold dark:text-white">{{messageInfo.senderInfo.name}}</p>
                <p class="text-sm text-gray-500">{{getDate()}} {{getTime()}}</p>

                <button class="ml-auto mr-[20px]" mat-button [matMenuTriggerFor]="menu"><mat-icon class="text-white" aria-hidden="false" aria-label="Example home icon" fontIcon="more_horiz"></mat-icon></button>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item>
                        <span>Reply</span>
                        <mat-icon class="order-2" fontIcon="reply"></mat-icon>
                    </button>

                    <button mat-menu-item (click)="emitEditingMessageId()" *ngIf="messageInfo.messageObj.sender === uid">
                        <span>Edit</span>
                        <mat-icon class="order-2" fontIcon="edit"></mat-icon>
                    </button>

                    <button mat-menu-item (click)="deleteMessage()" *ngIf="messageInfo.messageObj.sender === uid">
                        <span>Delete</span>
                        <mat-icon class="order-2" fontIcon="delete"></mat-icon>
                    </button>
                </mat-menu>
            </div>

            <p class="text-base whitespace-pre dark:text-white">{{messageInfo.messageObj.message}}</p>
            <img *ngIf="mediaUrl !== ''" [src]="mediaUrl" class="mt-[10px] max-h-[300px]"/> <!-- [ngClass]="{'max-h-[349px]': true, 'max-h-[350px]' : false}" -->
        </div>
    </div>
</div>
